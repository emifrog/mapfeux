name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # L'application est construite avec des valeurs factices : la CI ne doit
  # jamais disposer d'une clé de production. Cahier §25.2.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_value

jobs:
  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installation verrouillée
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

  worker:
    name: Worker — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/geo-worker
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # L'environnement conda-forge est la référence : la CI doit valider le
      # même environnement que les postes de développement. ADR-014.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: services/geo-worker/environment.yml
          cache-environment: true

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy src

      - name: Tests
        run: pytest

  migrations:
    name: Migrations Supabase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      # Les migrations doivent s'appliquer sur une base vide, dans l'ordre, sans
      # intervention. Cahier §24.2.
      #
      # L'image postgis/postgis pré-installe PostGIS et ses compagnons dans le
      # schéma `public`. Un projet Supabase neuf ne les a pas : c'est la première
      # migration qui les crée dans `extensions`. Sans ce nettoyage,
      # `create extension if not exists postgis with schema extensions` devient
      # un no-op silencieux, l'extension reste dans `public`, et le type
      # `extensions.geometry` n'existe jamais.
      - name: Ramener la base aux conditions d'un projet Supabase neuf
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          drop extension if exists postgis_tiger_geocoder cascade;
          drop extension if exists postgis_topology cascade;
          drop extension if exists postgis_raster cascade;
          drop extension if exists postgis cascade;
          drop extension if exists fuzzystrmatch cascade;
          drop extension if exists pg_trgm cascade;
          drop schema if exists tiger cascade;
          drop schema if exists tiger_data cascade;
          drop schema if exists topology cascade;

          create schema if not exists extensions;

          create role anon nologin noinherit;
          create role authenticated nologin noinherit;
          create role service_role nologin noinherit bypassrls;

          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key);
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          SQL

      # Garde-fou : si PostGIS repartait dans `public`, l'échec doit être lisible
      # ici plutôt que trente lignes plus bas sur un type introuvable.
      - name: Vérifier que le préambule est correct
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regtype('extensions.geometry') is not null then
              raise exception 'PostGIS est déjà présent dans extensions avant les migrations.';
            end if;
            if to_regtype('public.geometry') is not null then
              raise exception 'PostGIS est resté dans public : le nettoyage a échoué.';
            end if;
          end $$;
          SQL

      - name: Appliquer les migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "--- $file"
            psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Appliquer le seed
        run: |
          for file in supabase/seed/*.sql; do
            echo "--- $file"
            psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Vérifier l'absence d'accès anonyme aux schémas internes
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare leaked text;
          begin
            select string_agg(format('%s.%s', table_schema, table_name), ', ')
            into leaked
            from information_schema.role_table_grants
            where grantee in ('anon', 'authenticated')
              and table_schema in ('app','geo','fire','meteo','air','radar','ingest','admin','audit');

            if leaked is not null then
              raise exception 'Accès anonyme détecté sur des schémas internes : %', leaked;
            end if;
          end $$;
          SQL
