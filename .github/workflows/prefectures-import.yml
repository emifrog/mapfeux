# =============================================================================
# Capture préfectorale — cahier v2.1 §9.2 et §20.4, ADR-026, plan J4.
#
# La passe lit la liste blanche en base, archive chaque page brute avant
# analyse et range les publications datées en citations — jamais réécrites,
# jamais supprimées. Le critère de J4 vise « visible en moins de trente
# minutes » : le cron demande le quart d'heure, en sachant que GitHub
# étrangle les crons serrés (mesuré sur le radar : ~une passe par heure) —
# l'ordonnancement propre (§8.1) resserrera.
#
# Secrets requis (dépôt) : INGESTION_DATABASE_URL, SUPABASE_URL,
# SUPABASE_SECRET_KEY — déjà posés.
# =============================================================================

name: Capture prefectures

# Plus de cron ici depuis le 13 septembre 2026 : le déclencheur est la tâche
# planifiée Windows `MapFeux-Prefectures` (ops/windows/tasks.psd1). Mesuré sur
# sept jours, le cron Actions n'a jamais tenu sa cadence sous-quotidienne —
# une passe toutes les trois à cinq heures quel que soit l'intervalle demandé
# (stratégie §8.1). Le déclenchement manuel reste, pour reprendre la main le
# temps d'une panne du poste.
on:
  workflow_dispatch:

concurrency:
  group: prefectures-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Pages d'actualités vers les citations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/geo-worker/requirements-ingestion.txt
            services/geo-worker/requirements-prefectures.txt

      - name: Dépendances
        run: |
          pip install -r services/geo-worker/requirements-ingestion.txt
          pip install -r services/geo-worker/requirements-prefectures.txt

      - name: Capture
        env:
          DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/import-prefectures.py
