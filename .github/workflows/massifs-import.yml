# =============================================================================
# Capture des niveaux d'accès aux massifs — cahier v2.1 §9.2, ADR-026, J4.
#
# Le site interservices publie un niveau par massif et par jour, la
# prévision du lendemain vers 18 h. Toutes les trois heures suffisent à
# suivre les ré-émissions exceptionnelles sans marteler le site ; la passe
# capte aujourd'hui et demain, et dit ce qui n'est pas encore publié.
#
# Secrets requis (dépôt) : INGESTION_DATABASE_URL, SUPABASE_URL,
# SUPABASE_SECRET_KEY — déjà posés.
# =============================================================================

name: Capture massifs

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:

concurrency:
  group: massifs-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Niveaux d'accès vers le registre
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/geo-worker/requirements-ingestion.txt

      - name: Dépendances
        run: pip install -r services/geo-worker/requirements-ingestion.txt

      - name: Capture
        env:
          DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/import-massifs.py
