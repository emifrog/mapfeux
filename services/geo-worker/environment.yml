# =============================================================================
# Environnement du worker géospatial — micromamba / conda-forge
#
# Remplace l'image Docker prévue au cahier §11 (voir ADR-014).
#
# Motif du choix : sur Windows, `pip install` suffit pour rasterio, pyproj,
# shapely et geopandas, mais **ecCodes** — nécessaire à la lecture des GRIB2
# AROME — n'a pas de roue PyPI fiable. conda-forge fournit des binaires win-64
# pour ecCodes, GDAL et cfgrib, ce que ni pip ni un venv nu ne savent faire.
#
# Ce fichier est la **source** ; `conda-lock.yml`, à côté, est le **verrou** :
# les versions exactes, avec leurs empreintes, pour linux-64 (CI, VPS) et
# win-64 (poste). Sans lui, chaque recréation laissait le solveur choisir une
# combinaison différente — relevé par un audit externe le 15 septembre 2026.
#
# Création :   micromamba create -n mapfeux-geo -f conda-lock.yml -y
# Activation : micromamba activate mapfeux-geo
# Régénérer le verrou après toute modification de ce fichier :
#   micromamba create -n conda-lock -c conda-forge conda-lock -y   # une fois
#   micromamba run -n conda-lock conda-lock --micromamba \
#     -f environment.yml -p linux-64 -p win-64 --lockfile conda-lock.yml
# =============================================================================
name: mapfeux-geo

channels:
  - conda-forge

dependencies:
  # Version conservatrice : conda-forge suit 3.13, mais 3.12 offre la couverture
  # binaire la plus large sur l'ensemble de la pile géospatiale. À réévaluer au
  # premier blocage, pas avant.
  - python=3.12

  # Pile géospatiale — binaires conda-forge obligatoires
  # GDAL n'est pas épinglé : le solveur choisit la version compatible avec le
  # reste de la pile. Le verrouillage se fait dans `conda-lock.yml`, pas ici.
  - gdal
  - eccodes
  - proj
  - geos

  # Lecture des formats météo
  # `cfgrib` tire `python-eccodes`, les liaisons Python d'ecCodes.
  - cfgrib
  - xarray
  - netcdf4
  - rasterio
  - rioxarray
  # Mosaïques radar ODIM (HDF5) — le driver HDF5 manque aux roues rasterio,
  # h5py les lit partout, roues PyPI comprises.
  - h5py
  # Pages d'actualités préfectorales (ADR-026) — les sites nouvelle
  # génération n'ont plus de RSS, on lit leurs cartes DSFR.
  - beautifulsoup4

  # Géométries et référentiels
  - geopandas
  - shapely
  - pyproj
  - fiona

  # Numérique
  - numpy
  - pandas
  # Lecture et écriture du corpus d'archives FIRMS, stocké en Parquet.
  # Absent, `pd.read_parquet` échoue à l'import et non à l'exécution : la CI
  # comme toute recréation d'environnement casserait sur le corpus.
  - pyarrow
  # Typage de pandas. Les autres bibliothèques scientifiques sont déclarées
  # `ignore_missing_imports` faute de stubs publiés ; pandas en a, et le corpus
  # est justement du code qui remanie des tableaux — l'endroit où le typage
  # rapporte le plus. Sans ce paquet, `mypy strict` échoue sur `geo_worker.corpus`.
  - pandas-stubs

  # Base de données
  - psycopg
  - sqlalchemy

  # Service et outillage
  - fastapi
  - uvicorn
  - pydantic
  - pydantic-settings
  - httpx
  - tenacity
  - apscheduler
  - structlog
  - python-dotenv

  # Qualité
  - pytest
  - pytest-asyncio
  - pytest-cov
  - mypy
  - ruff

  - pip
  - pip:
      - opentelemetry-api
      - opentelemetry-sdk
      - opentelemetry-exporter-otlp
      # Écriture des archives de tuiles vectorielles (J3). Le découpage des
      # géométries reste dans PostGIS (ST_AsMVT) ; cette bibliothèque ne fait
      # qu'assembler le fichier au format PMTiles v3.
      - pmtiles
